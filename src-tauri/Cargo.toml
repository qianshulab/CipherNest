[package]
name = "ciphernest"
version = "0.4.0"
description = "Local-first encrypted password vault"
authors = ["CipherNest contributors"]
license = "MIT"
repository = "https://github.com/qianshulab/CipherNest"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ciphernest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
atomicwrites = "0.4"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.3"
hkdf = "0.12"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[dev-dependencies]
rcgen = "0.13.2"
tempfile = "3"
