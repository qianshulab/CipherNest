name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: windows-2022
            label: Windows
          - os: ubuntu-22.04
            label: Linux
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Use Node 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Use release Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.89.0 clippy rustfmt
          rustup default 1.89.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release validation tools
        run: node --test scripts/release-tools.node-test.mjs

      - name: Run frontend and Rust tests
        run: pnpm check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Compile native desktop binary
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle -- --locked
